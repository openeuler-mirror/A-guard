# 仓库无 pyproject.toml 时的最小 Ruff 配置
target-version = "py39"   # 仓库无 python_requires 声明，按存量兼容默认 py39
line-length = 100

[lint]
# 存量仓库默认只开错误类规则；按基线预检结果收紧
select = ["E", "F", "I"]
ignore = ["E501"]
# 中文/全角标点注释仓库：后续把 "RUF" 加回 select 时必须把 RUF001/002/003 加入 ignore
#（「，」等全角标点会被判为模糊字符，属误报）
# 收紧路径：清理 PR 后按阶段加回 B → UP/SIM → RUF（规则分批启用）
